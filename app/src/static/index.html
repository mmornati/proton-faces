<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proton-faces</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
:root {
  --bg: #121417;
  --panel: #1a1d21;
  --panel2: #23272c;
  --text: #e6e8eb;
  --muted: #9aa0a6;
  --accent: #4da3ff;
  --green: #34c97b;
  --red: #ff5f57;
  --border: #2c3138;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text);
}
header {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  border-bottom: 1px solid var(--border); padding: 10px 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
h1 { font-size: 17px; margin: 0; font-weight: 600; }
h1 span { color: var(--accent); }
nav a {
  color: var(--muted); text-decoration: none; padding: 6px 10px;
  border-radius: 8px; font-size: 14px;
}
nav a.active, nav a:hover { color: var(--text); background: var(--panel2); }
#searchbar {
  flex: 1; min-width: 220px; display: flex; gap: 8px; align-items: center;
}
#q {
  flex: 1; background: var(--panel); border: 1px solid var(--border);
  color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 14px;
}
#q:focus { outline: none; border-color: var(--accent); }
button {
  background: var(--accent); color: #fff; border: 0; padding: 9px 14px;
  border-radius: 8px; font-size: 14px; cursor: pointer;
}
button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
button.small { padding: 4px 8px; font-size: 12px; border-radius: 6px; }
#status { color: var(--muted); font-size: 13px; margin-left: auto; }
main { padding: 18px; }
#counts { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
}
.card { position: relative; border-radius: 10px; overflow: hidden; background: var(--panel); }
.card img { width: 100%; height: 180px; object-fit: cover; display: block; cursor: pointer; }
.card .score {
  position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.6);
  color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 6px;
}
.card .date {
  position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.6);
  color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 6px;
}
.card .facebadge {
  position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,.65);
  color: var(--accent); font-size: 11px; padding: 2px 7px; border-radius: 6px;
  cursor: pointer; border: 0;
}
.card .facebadge:hover { background: var(--accent); color: #fff; }
.people-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.person {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 10px; text-align: center; cursor: pointer;
}
.person:hover { border-color: var(--accent); }
.places-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.place {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
}
.place:hover { border-color: var(--accent); }
.place .city { font-size: 15px; font-weight: 600; }
.place .count { color: var(--muted); font-size: 13px; }
.person img {
  width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
  background: var(--panel2); margin-bottom: 8px;
}
.person .name { font-size: 14px; font-weight: 600; }
.person .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
.person input { width: 100%; margin-top: 6px; padding: 5px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); }
.person .merge-btn { margin-top: 6px; width: 100%; background: var(--panel2); color: var(--muted); border: 1px solid var(--border); }
.person .merge-btn:hover { color: var(--text); border-color: var(--accent); }
.dups { margin-bottom: 18px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.duphead {
  width: 100%; display: flex; align-items: center; gap: 8px;
  background: none; border: 0; color: var(--text); font-size: 14px; font-weight: 600;
  padding: 12px 14px; cursor: pointer; border-radius: 0;
}
.duphead:hover { background: var(--panel2); }
.duphead .dupcount { background: var(--accent); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 10px; }
.duphead .dupchev { margin-left: auto; color: var(--muted); }
.dupbody { padding: 0 12px 12px; display: none; }
#dups.open .dupbody { display: block; }
.dup { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; }
.dup:hover { background: var(--panel2); }
.dupthumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--panel2); flex: none; }
.dupthumb-empty { background: var(--panel2); }
.dupnames { font-size: 14px; font-weight: 600; }
.dup-arrow { color: var(--accent); margin: 0 4px; }
.dupsim { color: var(--muted); font-size: 12px; margin-left: auto; }
/* merge picker modal */
#mergepick {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
  z-index: 150; align-items: flex-start; justify-content: center; padding: 60px 20px 20px;
}
#mergepick.open { display: flex; }
#mergepickbox {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  max-width: 520px; width: 100%; max-height: 80vh; display: flex; flex-direction: column;
  overflow: hidden;
}
#mergepickhead { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
#mergepickhead img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--panel2); }
#mergepickhead .srcname { font-size: 15px; font-weight: 600; }
#mergepickhead .srchint { color: var(--muted); font-size: 12px; margin-top: 2px; }
#mergepickhead button { margin-left: auto; }
#mpsearch {
  margin: 10px 12px 0; padding: 9px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel2); color: var(--text); font-size: 14px;
}
#mpsearch:focus { outline: none; border-color: var(--accent); }
#mergepicklist { overflow: auto; padding: 8px; }
.mpitem { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; cursor: pointer; width: 100%; border: 0; background: none; color: var(--text); text-align: left; }
.mpitem:hover { background: var(--panel2); }
.mpitem img { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; background: var(--panel2); flex: none; }
.mpitem .mpname { font-size: 14px; font-weight: 600; }
.mpitem .mpmeta { color: var(--muted); font-size: 12px; margin-top: 2px; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
#faceform { display: flex; gap: 8px; align-items: center; }
#facefile { font-size: 13px; color: var(--muted); }
/* lightbox */
#lightbox {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9);
  z-index: 100; align-items: center; justify-content: center; padding: 24px;
}
#lightbox.open { display: flex; }
#lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
#lbclose { position: absolute; top: 16px; right: 24px; font-size: 30px; color: #fff; cursor: pointer; background: none; border: 0; }
/* photo detail with face overlays */
#detail {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92);
  z-index: 100; padding: 28px; overflow: auto;
}
#detail.open { display: block; }
#detailbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
#detailbar .name { color: var(--muted); font-size: 14px; }
#detailimgwrap {
  position: relative; display: inline-block; max-width: 100%;
  border-radius: 8px; overflow: hidden; background: var(--panel);
}
#detailimgwrap img { display: block; max-width: 100%; max-height: 72vh; }
#detailbody { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
#metapanel {
  flex: 1 1 260px; min-width: 260px; max-width: 420px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; font-size: 13px;
}
#metapanel h3 { margin: 0 0 10px; font-size: 14px; }
#metapanel table { width: 100%; border-collapse: collapse; }
#metapanel td { padding: 4px 6px; vertical-align: top; }
#metapanel td.k { color: var(--muted); white-space: nowrap; width: 110px; }
#metapanel td.v { color: var(--text); word-break: break-all; }
#metapanel .tagpill {
  display: inline-block; background: var(--panel2); border: 1px solid var(--border);
  border-radius: 6px; padding: 1px 8px; margin: 1px 3px 1px 0; font-size: 11px;
  color: var(--accent);
}
.facebox {
  position: absolute; border: 2px solid var(--accent); border-radius: 6px;
  cursor: pointer; background: rgba(77,163,255,.08);
}
.facebox:hover { background: rgba(77,163,255,.25); }
.facebox .tag {
  position: absolute; left: 0; top: -20px; background: var(--accent); color: #fff;
  font-size: 11px; padding: 1px 6px; border-radius: 4px; white-space: nowrap;
}
.facebox.unassigned { border-color: var(--red); }
.facebox.unassigned .tag { background: var(--red); }
/* popover */
#popover {
  display: none; position: fixed; z-index: 200; background: var(--panel);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px; min-width: 230px;
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
}
#popover.open { display: block; }
#popover h3 { margin: 0 0 8px; font-size: 14px; }
#popover .faces { display: flex; gap: 6px; flex-wrap: wrap; max-height: 160px; overflow: auto; }
#popover .faces button { flex: 1 1 45%; }
#popover input { width: 100%; padding: 7px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); margin: 8px 0; }
#popover .row { display: flex; gap: 6px; margin-top: 4px; }
#popover .hint { color: var(--muted); font-size: 11px; margin-top: 6px; }
/* unassigned queue */
.facegrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.faceitem { position: relative; border-radius: 10px; overflow: hidden; background: var(--panel); cursor: pointer; }
.faceitem img { width: 100%; height: 140px; object-fit: cover; display: block; }
.faceitem:hover { outline: 2px solid var(--accent); }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--panel2); border: 1px solid var(--border); color: var(--text);
  padding: 10px 18px; border-radius: 10px; z-index: 300; font-size: 14px;
  box-shadow: 0 6px 24px rgba(0,0,0,.4);
}
/* places map */
#mapwrap { margin-bottom: 16px; }
#map { height: 45vh; border-radius: 12px; border: 1px solid var(--border); background: #14171a; z-index: 1; }
.leaflet-container { background: #14171a; font-family: inherit; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); }
.leaflet-popup-content { margin: 10px 12px; }
.leaflet-popup-content img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; display: block; margin-bottom: 6px; }
.leaflet-popup-content .pcity { font-weight: 600; font-size: 14px; }
.leaflet-popup-content .pcount { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
  background-color: rgba(77,163,255,.25);
}
.marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
  background-color: rgba(77,163,255,.7); color: #fff;
}
.leaflet-control-attribution { font-size: 9px; background: rgba(18,20,23,.8); color: var(--muted); }
.leaflet-control-attribution a { color: var(--accent); }
.leaflet-bar a, .leaflet-bar a:hover { background: var(--panel2); color: var(--text); border-color: var(--border); }
/* date rail */
#daterailwrap { position: fixed; right: 0; top: 52px; bottom: 0; width: 58px; z-index: 5; overflow: hidden; }
#daterail { position: absolute; right: 6px; top: 8px; bottom: 8px; width: 50px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-right: 4px; }
#daterail::-webkit-scrollbar { width: 4px; }
#daterail .yr { color: var(--muted); font-size: 12px; font-weight: 600; padding: 3px 6px; border-radius: 6px; cursor: pointer; text-align: center; }
#daterail .yr:hover, #daterail .yr.active { color: var(--text); background: var(--panel2); }
#daterail .mo { color: var(--muted); font-size: 10px; padding: 1px 6px; border-radius: 6px; cursor: pointer; text-align: center; }
#daterail .mo:hover, #daterail .mo.active { color: var(--accent); background: var(--panel2); }
#daterail .yr.expanded { background: var(--panel2); }
/* albums */
.albums-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.album { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; }
.album:hover { border-color: var(--accent); }
.album img { width: 100%; height: 150px; object-fit: cover; display: block; background: var(--panel2); }
.album .aname { padding: 8px 10px; font-size: 14px; font-weight: 600; }
.album .acount { padding: 0 10px 8px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>proton<span>-faces</span></h1>
  <nav>
    <a href="#" data-view="photos" class="active">Photos</a>
    <a href="#" data-view="people">People</a>
    <a href="#" data-view="places">Places</a>
    <a href="#" data-view="albums">Albums</a>
    <a href="#" data-view="unassigned">Unassigned</a>
  </nav>
  <div id="searchbar">
    <input id="q" placeholder="Search: &quot;dog&quot;, &quot;car&quot;, &quot;Lille&quot;, &quot;beach&quot;...">
    <button id="btn-search">Search</button>
    <form id="faceform">
      <input type="file" id="facefile" accept="image/*">
      <button type="submit" class="secondary">Find face</button>
    </form>
  </div>
  <div id="status"></div>
</header>
<main>
  <div id="counts"></div>
  <div id="mapwrap" style="display:none"><div id="map"></div></div>
  <div id="daterailwrap" style="display:none"><div id="daterail"></div></div>
  <div id="view"></div>
</main>
<div id="detail">
  <div id="detailbar">
    <button id="dclose" class="secondary">Close</button>
    <span class="name" id="dname"></span>
    <button id="dfull" class="secondary">View full resolution</button>
  </div>
  <div id="detailbody">
    <div id="detailimgwrap"><img id="dimg" alt=""></div>
    <div id="metapanel"></div>
  </div>
</div>
<div id="lightbox">
  <button id="lbclose">&times;</button>
  <img id="lbimg" alt="">
</div>
<div id="popover"></div>
<div id="mergepick">
  <div id="mergepickbox">
    <div id="mergepickhead">
      <img id="mpsrcimg" alt="">
      <div>
        <div class="srcname" id="mpsrcname"></div>
        <div class="srchint">Merge this person into…</div>
      </div>
      <button id="mpclose" class="secondary small">Close</button>
    </div>
    <input id="mpsearch" type="text" placeholder="Search name…" autocomplete="off">
    <div id="mergepicklist"></div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
let state = { view: "photos", q: "", photos: [], people: [], albumUid: null };
let popoverFace = null;
let map = null, markerGroup = null;
// infinite scroll for the Photos view
let photoOffset = 0;
let photoLoading = false;
let photoDone = false;
const photoPage = 200;
const sentinelObserver = new IntersectionObserver((entries) => {
  if (entries[0].isIntersecting) loadMorePhotos();
}, { rootMargin: "400px" });

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtDate(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  return d.toLocaleDateString();
}

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function renderPhotos(list, append) {
  const el = $("#view");
  if (!list.length && !append) {
    el.innerHTML = '<div class="empty">No photos yet — the indexer is probably still downloading thumbnails.</div>';
    return;
  }
  if (!append) {
    el.innerHTML = `<div class="grid">${list.map(cardHtml).join("")}</div>`;
  } else {
    const grid = el.querySelector(".grid");
    if (!grid) { el.innerHTML = `<div class="grid">${list.map(cardHtml).join("")}</div>`; }
    else grid.insertAdjacentHTML("beforeend", list.map(cardHtml).join(""));
  }
  el.querySelectorAll(".card img").forEach((img) => img.addEventListener("click", () => openDetail(img.dataset.uid)));
  el.querySelectorAll(".facebadge").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); openDetail(b.dataset.uid); }));
  // sentinel for infinite scroll (Photos and Albums views)
  if ((state.view === "photos" || state.view === "albums") && !state.q && !photoDone) {
    let sentinel = $("#sentinel");
    if (!sentinel) {
      sentinel = document.createElement("div");
      sentinel.id = "sentinel";
      sentinel.style.height = "1px";
      el.appendChild(sentinel);
    }
    sentinelObserver.observe(sentinel);
  }
}

function cardHtml(p) {
  return `
    <div class="card">
      <img loading="lazy" src="${p.thumb_url}" data-uid="${esc(p.uid)}" alt="">
      <div class="date">${fmtDate(p.capture_time)}</div>
      <button class="facebadge" data-uid="${esc(p.uid)}">faces</button>
      ${p.score !== undefined ? `<div class="score">${(p.score * 100).toFixed(0)}%</div>` : ""}
      ${p.place ? `<div class="date" style="right:auto;left:6px;top:auto;bottom:6px">${esc(p.place)}</div>` : ""}
    </div>`;
}

function openLightbox(uid) {
  $("#lightbox").classList.add("open");
  $("#lbimg").src = `/api/photos/${uid}/full`;
}

async function openDetail(uid) {
  $("#detail").classList.add("open");
  $("#dname").textContent = uid;
  $("#dfull").onclick = () => openLightbox(uid);
  const img = $("#dimg");
  img.src = `/api/photos/${uid}/thumb`;
  img.dataset.uid = uid;
  // clear old boxes
  const wrap = $("#detailimgwrap");
  wrap.querySelectorAll(".facebox").forEach((b) => b.remove());
  img.onload = () => loadFaceBoxes(uid);
  loadPhotoMeta(uid);
}

async function loadPhotoMeta(uid) {
  const panel = $("#metapanel");
  panel.innerHTML = '<h3>Metadata</h3><div class="empty" style="padding:8px 0">Loading…</div>';
  let m;
  try {
    m = await api(`/api/photos/${uid}/meta`);
  } catch (e) {
    panel.innerHTML = '<h3>Metadata</h3><div class="empty" style="padding:8px 0">Unavailable</div>';
    return;
  }
  const escv = (v) => esc(v ?? "—");
  const tags = (m.tags || []).map((t) => `<span class="tagpill">${escv(t)}</span>`).join("") || "—";
  const albums = (m.albums_detail || [])
    .map((a) => `<span class="tagpill">${escv(a.name)}</span>`).join("") || "—";
  const people = (m.people || [])
    .map((p) => `<span class="tagpill">${escv(p.name || "person " + p.person_id)}</span>`).join("") || "—";
  const size = m.size != null ? fmtBytes(m.size) : "—";
  const rows = [
    ["Name", m.name],
    ["Type", m.media_type || m.mediaType],
    ["Captured", m.capture_time ? fmtDateTime(m.capture_time) : "—"],
    ["Size", size],
    ["SHA-1", m.sha1],
    ["Location", m.place || (m.gps_lat != null ? `${m.gps_lat.toFixed(4)}, ${m.gps_lng.toFixed(4)}` : "—")],
    ["Albums", albums],
    ["Tags", tags],
    ["People", people],
    ["Faces", m.face_count != null ? `${m.face_count}` : "—"],
    ["UID", m.uid],
  ];
  panel.innerHTML = `<h3>Metadata</h3><table>${rows
    .map(([k, v]) => `<tr><td class="k">${escv(k)}</td><td class="v">${v}</td></tr>`).join("")}</table>`;
}

function fmtBytes(n) {
  if (n == null) return "—";
  const u = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i === 0 ? 0 : 1)} ${u[i]}`;
}

function fmtDateTime(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  return d.toLocaleString();
}

async function loadFaceBoxes(uid) {
  const wrap = $("#detailimgwrap");
  wrap.querySelectorAll(".facebox").forEach((b) => b.remove());
  let faces = [];
  try {
    const data = await api(`/api/photos/${uid}/faces`);
    faces = data.faces || [];
  } catch (e) { return; }
  const img = $("#dimg");
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (!iw || !ih) return;
  for (const f of faces) {
    const [x, y, w, h] = f.bbox;
    const box = document.createElement("div");
    box.className = "facebox" + (f.person_id == null ? " unassigned" : "");
    box.style.left = (x * 100) + "%";
    box.style.top = (y * 100) + "%";
    box.style.width = (w * 100) + "%";
    box.style.height = (h * 100) + "%";
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = f.person_name || "?";
    box.appendChild(tag);
    box.addEventListener("click", (e) => {
      e.stopPropagation();
      openFacePopover(f, e.clientX, e.clientY);
    });
    wrap.appendChild(box);
  }
}

async function openFacePopover(face, x, y) {
  popoverFace = face;
  const pv = $("#popover");
  let people = [];
  try { people = (await api("/api/people")).people || []; } catch (e) {}
  const nameHtml = face.person_name ? `<h3>${esc(face.person_name)} <span style="color:var(--muted);font-weight:400">(face #${face.id})</span></h3>` : `<h3>Unassigned face #${face.id}</h3>`;
  pv.innerHTML = `${nameHtml}
    <input id="popname" placeholder="Type a name and press Enter" value="${esc(face.person_name || "")}">
    <div class="faces">${people.slice(0, 12).map((p) => `<button class="small" data-pid="${p.id}">${esc(p.name || "person " + p.id)}</button>`).join("") || '<span style="color:var(--muted);font-size:12px">No people yet</span>'}</div>
    <div class="row">
      <button class="secondary small" id="pop-unassign" style="margin-left:auto">Unassign</button>
    </div>
    <div class="hint">Naming a face auto-tags similar unassigned faces.</div>`;
  pv.classList.add("open");
  pv.style.left = Math.min(x, window.innerWidth - 260) + "px";
  pv.style.top = Math.min(y, window.innerHeight - 300) + "px";
  const name = $("#popname");
  name.focus();
  const commit = async (body) => {
    try {
      const r = await api(`/api/faces/${face.id}/person`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      closePopover();
      toast(`Saved. ${r.assigned_similar || 0} similar face(s) auto-tagged.`);
      if (state.view === "people") loadPeople();
      else if ($("#detail").classList.contains("open")) loadFaceBoxes($("#dimg").dataset.uid);
      else if (state.view === "unassigned") loadUnassigned();
    } catch (e) { toast("Error: " + e.message); }
  };
  name.addEventListener("keydown", async (e) => {
    if (e.key === "Enter" && name.value.trim()) await commit({ name: name.value.trim() });
  });
  pv.querySelectorAll("button[data-pid]").forEach((b) => b.addEventListener("click", () => commit({ person_id: +b.dataset.pid })));
  $("#pop-unassign").addEventListener("click", async () => {
    try {
      await api(`/api/faces/${face.id}/unassign`, { method: "POST" });
      closePopover();
      toast("Face unassigned.");
      if (state.view === "people") loadPeople();
      else if ($("#detail").classList.contains("open")) loadFaceBoxes($("#dimg").dataset.uid);
      else if (state.view === "unassigned") loadUnassigned();
    } catch (e) { toast("Error: " + e.message); }
  });
}

function closePopover() {
  $("#popover").classList.remove("open");
  $("#popover").innerHTML = "";
  popoverFace = null;
}

function resetPhotoPaging() {
  photoOffset = 0;
  photoDone = false;
  const s = $("#sentinel");
  if (s) s.remove();
}

async function loadPhotos() {
  resetPhotoPaging();
  const base = state.q
    ? `/api/search?q=${encodeURIComponent(state.q)}`
    : state.albumUid
      ? `/api/albums/${encodeURIComponent(state.albumUid)}/photos`
      : "/api/photos";
  const url = `${base}?limit=${photoPage}&offset=0${state.beforeTs ? `&before=${state.beforeTs}` : ""}`;
  const data = await api(url);
  renderPhotos(data.results || data.photos || [], false);
  state.photos = data.results || data.photos || [];
  if (!state.q) {
    photoOffset = (data.photos || []).length;
    if ((data.photos || []).length < photoPage) photoDone = true;
  }
}

async function loadMorePhotos() {
  if (state.q || photoLoading || photoDone) return;
  photoLoading = true;
  try {
    const base = state.albumUid
      ? `/api/albums/${encodeURIComponent(state.albumUid)}/photos`
      : "/api/photos";
    const url = `${base}?limit=${photoPage}&offset=${photoOffset}${state.beforeTs ? `&before=${state.beforeTs}` : ""}`;
    const data = await api(url);
    const rows = data.photos || [];
    if (rows.length) {
      renderPhotos(rows, true);
      state.photos = state.photos.concat(rows);
      photoOffset += rows.length;
    }
    if (rows.length < photoPage) photoDone = true;
  } catch (e) {
    toast("Error loading more: " + e.message);
  } finally {
    photoLoading = false;
  }
}

async function loadAlbums() {
  const data = await api("/api/albums");
  const el = $("#view");
  if (!data.albums.length) {
    el.innerHTML = '<div class="empty">No albums yet.</div>';
    return;
  }
  $("#counts").textContent = `${data.albums.length} albums`;
  el.innerHTML = `<div class="albums-grid">${data.albums.map((a) => `
    <div class="album" data-uid="${esc(a.uid)}">
      ${a.cover_url ? `<img loading="lazy" src="${a.cover_url}" alt="">` : '<div style="width:100%;height:150px;background:var(--panel2)"></div>'}
      <div class="aname">${esc(a.name || "Album")}</div>
      <div class="acount">${a.photo_count} photos</div>
    </div>`).join("")}</div>`;
  el.querySelectorAll(".album").forEach((card) => card.addEventListener("click", async () => {
    state.albumUid = card.dataset.uid;
    state.beforeTs = null;
    state.view = "albums";
    document.querySelectorAll("nav a").forEach((x) => x.classList.remove("active"));
    document.querySelector('nav a[data-view="albums"]').classList.add("active");
    loadPhotos();
  }));
}

function renderDateRail(anchors) {
  const rail = $("#daterail");
  if (!anchors.length) { $("#daterailwrap").style.display = "none"; return; }
  $("#daterailwrap").style.display = "";
  let years = [];
  const byYear = {};
  anchors.forEach((a) => {
    const y = a.ym.slice(0, 4);
    if (!byYear[y]) { byYear[y] = []; years.push(y); }
    byYear[y].push(a);
  });
  years = years.sort().reverse();
  rail.innerHTML = years.map((y) => `
    <div class="yr" data-year="${y}">${y}</div>`).join("");
  rail.querySelectorAll(".yr").forEach((yrEl) => {
    yrEl.addEventListener("click", () => {
      const y = yrEl.dataset.year;
      const open = yrEl.classList.contains("expanded");
      rail.querySelectorAll(".yr").forEach((e) => { e.classList.remove("expanded", "active"); });
      rail.querySelectorAll(".mo").forEach((e) => e.remove());
      if (open) return;
      yrEl.classList.add("expanded");
      const mos = byYear[y].slice().reverse();
      mos.forEach((a) => {
        const mo = document.createElement("div");
        mo.className = "mo";
        mo.textContent = a.label.split(" ")[0]; // e.g. "Aug"
        mo.title = a.label;
        mo.addEventListener("click", () => jumpToDate(a.ym, a.first_ts));
        yrEl.after(mo);
      });
    });
  });
}

async function loadAnchors() {
  try {
    const data = await api("/api/photos/anchors");
    renderDateRail(data.anchors || []);
  } catch (e) {
    $("#daterailwrap").style.display = "none";
  }
}

function jumpToDate(ym, firstTs) {
  state.beforeTs = firstTs;
  state.albumUid = null;
  state.q = "";
  $("#q").value = "";
  resetPhotoPaging();
  api(`/api/photos?before=${firstTs}&limit=${photoPage}&offset=0`)
    .then((data) => {
      renderPhotos(data.photos || [], false);
      state.photos = data.photos || [];
      photoOffset = (data.photos || []).length;
      if ((data.photos || []).length < photoPage) photoDone = true;
      toast(`Showing photos up to ${ym}`);
    })
    .catch((e) => toast("Error: " + e.message));
}

async function loadPeople() {
  const data = await api("/api/people");
  renderPeopleGrid(data.people);
}

function personCardHtml(p) {
  return `
    <div class="person" data-id="${p.id}">
      ${p.cover_url ? `<img src="${p.cover_url}" alt="">` : '<div style="width:84px;height:84px;border-radius:50%;background:var(--panel2);margin:0 auto 8px"></div>'}
      <div class="name">${esc(p.name || "Unknown person")}</div>
      <div class="meta">${p.photo_count} photos · ${p.face_count} faces</div>
      <input class="rename" placeholder="Name" value="${esc(p.name || "")}">
      <button class="small merge-btn" data-id="${p.id}">Merge into…</button>
    </div>`;
}

function renderPeopleGrid(people) {
  const el = $("#view");
  if (!people.length) {
    el.innerHTML = '<div class="empty">No people found yet.</div>';
    return;
  }
  el.innerHTML = `<div class="dups" id="dups">
      <button class="duphead" id="duphead">Suggested merges<span class="dupcount" id="dupcount" style="display:none"></span><span class="dupchev">&#9656;</span></button>
      <div class="dupbody" id="dupbody"><div class="dup"><span class="dupsim">Expand to check for suggested merges.</span></div></div>
    </div>
    <div class="people-grid">${people.map(personCardHtml).join("")}</div>`;
  $("#duphead").addEventListener("click", toggleDups);
  bindPersonCards(people);
}

function toggleDups() {
  const box = $("#dups");
  const willOpen = !box.classList.contains("open");
  box.classList.toggle("open");
  $("#duphead .dupchev").textContent = willOpen ? "\u25BE" : "\u25B6";
  if (willOpen && (box.dataset.dirty || !box.dataset.loaded)) loadDuplicates();
}

function bindPersonCards(people) {
  const el = $("#view");
  el.querySelectorAll(".person").forEach((card) => {
    const pid = +card.dataset.id;
    card.querySelector(".rename").addEventListener("click", (e) => e.stopPropagation());
    card.querySelector(".rename").addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        e.stopPropagation();
        const name = e.target.value.trim();
        if (!name) return;
        const r = await api(`/api/people/${pid}/name`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
        if (r.merged) {
          toast(`Merged into existing "…${name}" (auto-tagged ${r.assigned_similar || 0}).`);
          patchAfterMerge(pid, r.target_id, r);
        } else {
          toast("Renamed.");
        }
      }
    });
    card.querySelector(".merge-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      openMergePicker(pid, people);
    });
    card.addEventListener("click", async () => {
      const data = await api(`/api/people/${pid}/photos`);
      renderPhotos(data.photos);
      $("#counts").textContent = `${data.count} faces`;
    });
  });
}

function patchAfterMerge(srcId, targetId, r) {
  const grid = document.querySelector(".people-grid");
  if (!grid) { loadPeople(); return; }
  const src = grid.querySelector(`.person[data-id="${srcId}"]`);
  const tgt = grid.querySelector(`.person[data-id="${targetId}"]`);
  if (src) src.remove();
  if (tgt && r.photo_count != null) {
    tgt.querySelector(".meta").textContent = `${r.photo_count} photos · ${r.face_count} faces`;
  }
  loadDuplicates();
}

let mpSrcId = null;
let mpPeople = [];

function openMergePicker(srcId, people) {
  const src = people.find((p) => p.id === srcId) || { id: srcId, name: null, cover_url: null };
  $("#mpsrcimg").src = src.cover_url || "";
  $("#mpsrcname").textContent = src.name || "Unknown person";
  mpSrcId = srcId;
  mpPeople = people;
  $("#mpsearch").value = "";
  renderMergePickerList();
  $("#mergepick").classList.add("open");
  $("#mpsearch").focus();
}

function renderMergePickerList() {
  const q = $("#mpsearch").value.trim().toLowerCase();
  const list = $("#mergepicklist");
  const others = mpPeople.filter((p) => p.id !== mpSrcId);
  const filtered = q
    ? others.filter((p) =>
        (p.name || "").toLowerCase().includes(q) ||
        String(p.id).includes(q.replace(/^#/, ""))
      )
    : others;
  list.innerHTML = filtered.length
    ? filtered.map((p) => `
      <button class="mpitem" data-tid="${p.id}">
        ${p.cover_url ? `<img loading="lazy" src="${p.cover_url}" alt="">` : '<div style="width:42px;height:42px;border-radius:8px;background:var(--panel2);flex:none"></div>'}
        <div>
          <div class="mpname">${esc(p.name || "Unknown person")}</div>
          <div class="mpmeta">${p.photo_count} photos · ${p.face_count} faces · #${p.id}</div>
        </div>
      </button>`).join("")
    : '<div class="empty">' + (q ? "No matching people." : "No other people to merge into.") + '</div>';
  list.querySelectorAll(".mpitem").forEach((item) => item.addEventListener("click", async () => {
    const target = +item.dataset.tid;
    const r = await api(`/api/people/${mpSrcId}/merge`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ target_id: target }) });
    closeMergePicker();
    toast(`Merged into ${mpPeople.find((p) => p.id === target)?.name || "person " + target}. Auto-tagged ${r.assigned_similar || 0} faces.`);
    patchAfterMerge(mpSrcId, target, r);
  }));
}

function closeMergePicker() {
  $("#mergepick").classList.remove("open");
  mpSrcId = null;
  mpPeople = [];
}

async function loadDuplicates() {
  const box = $("#dups");
  if (!box) return;
  if (!box.classList.contains("open")) { box.dataset.dirty = "1"; return; }
  const body = $("#dupbody");
  const count = $("#dupcount");
  try {
    const dd = await api("/api/people/duplicates?limit=50");
    box.dataset.loaded = "1";
    delete box.dataset.dirty;
    const n = (dd.duplicates || []).length;
    if (count) { count.style.display = n ? "" : "none"; count.textContent = n; }
    if (!n) {
      body.innerHTML = '<div class="dup"><span class="dupsim">No suggested merges.</span></div>';
      return;
    }
    body.innerHTML = dd.duplicates.map((d) => `
      <div class="dup" data-a="${d.a.id}" data-b="${d.b.id}">
        ${d.a.cover_url ? `<img class="dupthumb" loading="lazy" src="${d.a.cover_url}" title="${esc(d.a.name || "Person " + d.a.id)} (${d.a.id})" alt="">` : '<div class="dupthumb dupthumb-empty"></div>'}
        <span class="dupnames">${esc(d.a.name || "Person " + d.a.id)}</span>
        <span class="dup-arrow">+</span>
        ${d.b.cover_url ? `<img class="dupthumb" loading="lazy" src="${d.b.cover_url}" title="${esc(d.b.name || "Person " + d.b.id)} (${d.b.id})" alt="">` : '<div class="dupthumb dupthumb-empty"></div>'}
        <span class="dupnames">${esc(d.b.name || "Person " + d.b.id)}</span>
        <span class="dupsim">${Math.round(d.similarity * 100)}% similar</span>
        <button class="small" data-merge="1">Merge</button>
      </div>`).join("");
    body.querySelectorAll(".dup").forEach((d) => {
      d.querySelector("button[data-merge]").addEventListener("click", async () => {
        const a = +d.dataset.a, b = +d.dataset.b;
        const r = await api(`/api/people/${a}/merge`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ target_id: b }) });
        toast(`Merged. Auto-tagged ${r.assigned_similar || 0} faces.`);
        patchAfterMerge(a, b, r);
      });
    });
  } catch (e) {
    box.dataset.loaded = "1";
    delete box.dataset.dirty;
    if (count) count.style.display = "none";
    body.innerHTML = '<div class="dup"><span class="dupsim">Unavailable.</span></div>';
  }
}

function showPlacePhotos(place) {
  state.view = "photos";
  document.querySelectorAll("nav a").forEach((x) => x.classList.remove("active"));
  document.querySelector('nav a[data-view="photos"]').classList.add("active");
  state.q = "";
  $("#q").value = "";
  $("#mapwrap").style.display = "none";
  api(`/api/photos?place=${encodeURIComponent(place)}&limit=500`)
    .then((rows) => renderPhotos(rows.photos))
    .catch((e) => toast("Error: " + e.message));
}

function initMap() {
  if (map) return;
  map = L.map("map", { worldCopyJump: true }).setView([46.2, 2.2], 5);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);
  markerGroup = L.markerClusterGroup();
  map.addLayer(markerGroup);
}

async function loadPlaces() {
  const data = await api("/api/places?limit=500");
  const el = $("#view");
  if (!data.places.length) {
    $("#mapwrap").style.display = "none";
    el.innerHTML = '<div class="empty">No places yet — GPS enrichment is still running or no photos have GPS.</div>';
    return;
  }
  $("#counts").textContent = `${data.places.length} places`;
  initMap();
  $("#mapwrap").style.display = "";
  setTimeout(() => map.invalidateSize(), 50);
  markerGroup.clearLayers();
  const mdata = await api("/api/map?limit=1000");
  for (const m of mdata.markers) {
    const img = m.thumb_url ? `<img loading="lazy" src="${m.thumb_url}" alt="">` : "";
    const pop = L.popup().setContent(
      `${img}<div class="pcity">${esc(m.city)}</div><div class="pcount">${m.count} photos</div>` +
      `<button class="small" data-place="${esc(m.place)}">View photos</button>`
    );
    const marker = L.marker([m.lat, m.lng]).bindPopup(pop);
    marker.on("popupopen", () => {
      pop.getElement().querySelector("button[data-place]").addEventListener("click", () => {
        showPlacePhotos(m.place);
      });
    });
    markerGroup.addLayer(marker);
  }
  el.innerHTML = `<div class="places-grid">${data.places.map((p) => `
    <div class="place" data-place="${esc(p.place)}">
      <span class="city">${esc(p.city)}</span>
      <span class="count">${p.count} photos</span>
    </div>`).join("")}</div>`;
  el.querySelectorAll(".place").forEach((item) => item.addEventListener("click", async () => {
    showPlacePhotos(item.dataset.place);
  }));
}

async function loadUnassigned() {
  const data = await api("/api/faces/unassigned?limit=500");
  const el = $("#view");
  if (!data.faces.length) {
    el.innerHTML = '<div class="empty">No unassigned faces — great job!</div>';
    return;
  }
  $("#counts").textContent = `${data.faces.length} unassigned faces`;
  el.innerHTML = `<div class="facegrid">${data.faces.map((f) => `
    <div class="faceitem" data-id="${f.id}">
      <img loading="lazy" src="${f.crop_url}" alt="">
    </div>`).join("")}</div>`;
  el.querySelectorAll(".faceitem").forEach((item) => item.addEventListener("click", () => {
    openFacePopover({ id: +item.dataset.id, person_id: null, person_name: null }, event.clientX, event.clientY);
  }));
}

async function refresh() {
  try {
    const data = await api("/api/stats");
    const p = data.photos;
    $("#counts").textContent =
      `${p.done}/${p.total} photos indexed · ${p.done_with_thumb} displayable · ` +
      `${p.done_without_thumb} without preview (videos) · ${data.people} people · ${data.faces} faces`;
    const b = await fetch("/api/health").then((r) => r.json());
    $("#status").textContent = b.bridge.loggedIn ? "connected" : "bridge: not logged in";
  } catch (e) {
    $("#status").textContent = "bridge unreachable";
  }
}

document.querySelectorAll("nav a").forEach((a) => {
  a.addEventListener("click", async (e) => {
    e.preventDefault();
    document.querySelectorAll("nav a").forEach((x) => x.classList.remove("active"));
    a.classList.add("active");
    state.view = a.dataset.view;
    $("#q").value = "";
    state.q = "";
    if (state.view === "people") loadPeople();
    else if (state.view === "unassigned") loadUnassigned();
    else if (state.view === "places") loadPlaces();
    else if (state.view === "albums") { state.albumUid = null; state.beforeTs = null; $("#daterailwrap").style.display = "none"; loadAlbums(); }
    else { $("#mapwrap").style.display = "none"; state.albumUid = null; state.beforeTs = null; loadPhotos(); loadAnchors(); }
  });
});

$("#btn-search").addEventListener("click", async () => {
  state.q = $("#q").value.trim();
  if (!state.q) return loadPhotos();
  if (state.view !== "photos") {
    document.querySelectorAll("nav a").forEach((x) => x.classList.remove("active"));
    document.querySelector('nav a[data-view="photos"]').classList.add("active");
    state.view = "photos";
  }
  state.albumUid = null;
  $("#mapwrap").style.display = "none";
  $("#daterailwrap").style.display = "none";
  loadPhotos();
});
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#btn-search").click(); });

$("#faceform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = $("#facefile").files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append("file", f);
  const r = await fetch("/api/search/face", { method: "POST", body: fd });
  if (!r.ok) { alert("No face found in that image"); return; }
  const data = await r.json();
  renderPhotos(data.results);
});

$("#dclose").addEventListener("click", () => $("#detail").classList.remove("open"));
$("#lbclose").addEventListener("click", () => $("#lightbox").classList.remove("open"));
$("#lightbox").addEventListener("click", (e) => { if (e.target.id === "lightbox") $("#lightbox").classList.remove("open"); });
$("#mpclose").addEventListener("click", closeMergePicker);
$("#mpsearch").addEventListener("input", renderMergePickerList);
$("#mergepick").addEventListener("click", (e) => { if (e.target.id === "mergepick") closeMergePicker(); });
document.addEventListener("click", (e) => {
  if ($("#popover").classList.contains("open") && !$("#popover").contains(e.target)) closePopover();
});

(async () => {
  await refresh();
  await loadPhotos();
  loadAnchors();
  setInterval(refresh, 15000);
})();
</script>
</body>
</html>

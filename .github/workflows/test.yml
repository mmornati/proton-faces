name: Test

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Daily dependency vulnerability audit (pip-audit + bun audit).
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-tests:
    name: App tests (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements-core.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint (app + tests + scripts)
        run: ruff check app/src tests scripts

      - name: Syntax-check scripts
        run: |
          python -m py_compile \
            scripts/find-commons-faces.py \
            scripts/augment-demo-fixture.py \
            scripts/rebuild-faces-from-commons.py \
            scripts/fetch-demo-assets.py \
            scripts/capture_screenshots.py \
            scripts/capture_mobile_gif.py \
            scripts/perf_check_issue5.py \
            scripts/perf_check_live.py

      - name: Run unit tests with coverage
        run: pytest --cov=app/src --cov-fail-under=60 --cov-report=term-missing

  bridge-tests:
    name: Bridge tests (bun test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        working-directory: bridge
        run: bun install

      - name: Run bridge unit tests
        working-directory: bridge
        run: bun test

  docs-build:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict --clean

  dependency-audit:
    name: Dependency audit (pip-audit + bun audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r app/requirements-core.txt -r app/requirements-ml.txt -r requirements-dev.txt

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.23

      - name: Audit bridge dependencies
        working-directory: bridge
        run: |
          bun install
          bun audit
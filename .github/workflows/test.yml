name: Test

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Daily dependency vulnerability audit (pip-audit + bun audit).
    - cron: '17 3 * * *'
  # publish.yml calls this as its gate: no image is pushed unless every job
  # here passes on the exact commit being built.
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to test (default: the caller's commit)"
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Only PR runs are superseded by a newer push. Every main commit gets its own
# group: its Test run is the evidence release.yml checks before tagging it, so
# it must not be cancelled or left pending. The `test-` prefix keeps the group
# distinct from the caller's when this runs via workflow_call (github.workflow
# is then the caller's name).
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app-tests:
    name: App tests (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # Same Python as the app image (app/Dockerfile).
      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements-core.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint (app + tests + scripts)
        run: ruff check app/src tests scripts

      - name: Syntax-check scripts
        run: |
          python -m py_compile \
            scripts/find-commons-faces.py \
            scripts/augment-demo-fixture.py \
            scripts/rebuild-faces-from-commons.py \
            scripts/fetch-demo-assets.py \
            scripts/capture_screenshots.py \
            scripts/capture_mobile_gif.py \
            scripts/perf_check_issue5.py \
            scripts/perf_check_live.py

      - name: Run unit tests with coverage
        run: pytest --cov=app/src --cov-fail-under=60 --cov-report=term-missing

  bridge-tests:
    name: Bridge tests (bun test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: bridge
        run: bun install --frozen-lockfile

      - name: Run bridge unit tests
        working-directory: bridge
        run: bun test

  docs-build:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict --clean

  dependency-audit:
    name: Dependency audit (pip-audit + bun audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r app/requirements-core.txt -r app/requirements-ml.txt -r requirements-dev.txt

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Audit bridge dependencies
        working-directory: bridge
        run: |
          bun install --frozen-lockfile
          bun audit

  docker-build:
    # Catches Dockerfile breakage before merge; publish.yml does the real
    # (pushed) build after merge.
    name: Docker build (${{ matrix.image.name }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: bridge
            context: ./bridge
          - name: app
            context: ./app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/Dockerfile
          push: false
          pull: true
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.image.name }}

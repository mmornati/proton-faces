name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-tests:
    name: App tests (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements-core.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint (app + tests + scripts)
        run: ruff check app/src tests scripts

      - name: Syntax-check scripts
        run: |
          python -m py_compile \
            scripts/find-commons-faces.py \
            scripts/augment-demo-fixture.py \
            scripts/rebuild-faces-from-commons.py \
            scripts/fetch-demo-assets.py \
            scripts/capture_screenshots.py \
            scripts/perf_check_issue5.py \
            scripts/perf_check_live.py

      - name: Run unit tests with coverage
        run: pytest --cov=app/src --cov-fail-under=60 --cov-report=term-missing

  bridge-tests:
    name: Bridge tests (bun test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: bridge
        run: bun install

      - name: Run bridge unit tests
        working-directory: bridge
        run: bun test

  docs-build:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict --clean
name: Release

# Creates a GitHub Release with auto-generated notes (PR list + full changelog
# link) whenever a v* tag is pushed. The publish workflow builds the versioned
# Docker images on the same tag push; this workflow only writes the release.
#
# Two ways to trigger:
#   1. Push a tag:  git tag v1.2.3 && git push origin v1.2.3
#   2. Run the "Release" workflow from the Actions tab with a version input —
#      it creates and pushes the tag for you, then creates the release in the
#      same run. (A tag pushed with GITHUB_TOKEN does not trigger a new run,
#      so the release job must run on workflow_dispatch too.)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create and push tag
        env:
          # Passed through the environment, never interpolated into the
          # script: a crafted input would otherwise run as shell.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: create-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
          else
            TAG="$REF_NAME"
          fi
          gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$TAG" --jq ".body" > /tmp/notes-body.md
          cat >> /tmp/notes-body.md << EOF

          ## Images

          Versioned images are published to GHCR by the publish workflow on this tag:

          - ghcr.io/mmornati/proton-faces-app:$TAG
          - ghcr.io/mmornati/proton-faces-bridge:$TAG

          Pull with \`docker compose pull\` (tracks :latest) or pin compose.yml to $TAG.
          EOF
          gh release create "$TAG" --notes-file /tmp/notes-body.md
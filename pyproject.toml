[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["app/src"]

[tool.coverage.run]
source = ["app/src"]
omit = [
    "app/src/main.py",
    "app/src/indexer_main.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app/src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
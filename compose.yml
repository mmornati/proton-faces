name: proton-faces

# proton-faces: self-hosted people/object/location search over Proton Photos.
# Bring up with:  docker compose up -d
# (or  docker compose up -d --build  to build locally from source instead of pulling)
# One-time setup:  scripts/export-session.sh  (places auth-session.json in ./credentials)
#
# Three services share the `data` volume:
#   bridge writes thumbnails to data/work, the indexer consumes them and keeps
#   a permanent cache in data/thumbs, the API serves both. The bridge's auth
#   session lives at data/auth-session.json. All three share the SQLite index.
#
# The indexer runs in its own container so the face-detection workers can't
# preempt the FastAPI event loop on the box's CPU cores. Cross-process safety
# relies on per-status atomic claims in SQLite (`UPDATE ... WHERE status='new'`)
# plus WAL mode + a 30 s busy_timeout — no extra coordination needed.
# Set RUN_INDEXER=1 on the `app` service to fall back to the legacy
# single-process layout.
#
# Configurable via environment (.env):
#   PORT          host port for the web UI (default 8080)
#   DATA_MOUNT    bind-mount target for the data volume. Defaults to the
#                 named volume `data`; set e.g. DATA_MOUNT=/media/12tb/photos-index
#                 to persist data on a big disk. The directory must be writable
#                 by UID 1000 (the user both containers run as).
#   PHOTOS_MOUNT  optional read-only bind mount of a local Google Takeout export,
#                 used to backfill GPS/place data (see README). Unset by default;
#                 uncomment the volume line below when you have one.
#
# Images are published to GitHub Container Registry. By default `docker compose up`
# pulls the prebuilt images; use `docker compose up --build` to build from source
# instead (useful on low-power boxes to skip the pull, or to test local changes).

services:
  proton-bridge:
    build: ./bridge
    image: ghcr.io/mmornati/proton-faces-bridge:latest
    restart: unless-stopped
    volumes:
      - ${DATA_MOUNT:-data}:/data
    environment:
      - PORT=8090
      - DATA_DIR=/data
      - PROTON_DRIVE_CREDENTIALS_STORE=unsafe_file
      - PROTON_DRIVE_CACHE_DIR=/data
      # Optional: point at a custom Proton API environment.
      # - PROTON_DRIVE_BASE_URL=drive-api.proton.me
    networks:
      - internal

  indexer:
    # Runs the indexing pipeline only: sync / downloader / fullres / workers
    # / cluster / gps / albums. No HTTP. Same image as `app`, but a
    # different entry point.
    build: ./app
    image: ghcr.io/mmornati/proton-faces-app:latest
    restart: unless-stopped
    depends_on:
      - proton-bridge
    command: ["python", "indexer_main.py"]
    volumes:
      - ${DATA_MOUNT:-data}:/data
      # Optional Google Takeout export for GPS backfill (read-only).
      - ${PHOTOS_MOUNT:-/dev/null}:/takeout:ro
    environment:
      - DATA_DIR=/data
      - MODELS_DIR=/models
      - PHOTOS_DIR=/takeout
      - BRIDGE_URL=http://proton-bridge:8090
      - SYNC_INTERVAL=${SYNC_INTERVAL:-300}
      - SYNC_LIMIT=${SYNC_LIMIT:-0}
      - WORKERS=${WORKERS:-3}
      - CLUSTER_INTERVAL=${CLUSTER_INTERVAL:-1800}
      - GPS_INTERVAL=${GPS_INTERVAL:-21600}
      - FACE_SIM_THRESHOLD=${FACE_SIM_THRESHOLD:-0.45}
      - MIN_CLUSTER_SIZE=${MIN_CLUSTER_SIZE:-2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - internal

  app:
    build: ./app
    image: ghcr.io/mmornati/proton-faces-app:latest
    restart: unless-stopped
    depends_on:
      - proton-bridge
      - indexer
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ${DATA_MOUNT:-data}:/data
      # Optional Google Takeout export for GPS backfill (read-only).
      - ${PHOTOS_MOUNT:-/dev/null}:/takeout:ro
    environment:
      - DATA_DIR=/data
      - MODELS_DIR=/models
      - PHOTOS_DIR=/takeout
      - BRIDGE_URL=http://proton-bridge:8090
      - PORT=8080
      # RUN_INDEXER=0 -> serve API only; the `indexer` container handles
      # the pipeline. Flip to 1 to fall back to the legacy in-process layout.
      - RUN_INDEXER=${RUN_INDEXER:-0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - internal

volumes:
  data:

networks:
  internal:
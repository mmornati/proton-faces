name: proton-faces

# proton-faces: self-hosted people/object/location search over Proton Photos.
# Bring up with:  docker compose up -d
# One-time setup:  scripts/export-session.sh  (places auth-session.json in ./credentials)
#
# Three services share the `data` volume:
#   bridge writes thumbnails to data/work, the indexer consumes them and keeps
#   a permanent cache in data/thumbs, the API serves both. The bridge's auth
#   session lives at data/auth-session.json. All three share the SQLite index.
#
# The indexer runs in its own container so the face-detection workers can't
# preempt the FastAPI event loop on the box's CPU cores. Cross-process safety
# relies on per-status atomic claims in SQLite (`UPDATE ... WHERE status='new'`)
# plus WAL mode + a 30 s busy_timeout — no extra coordination needed.
# Set RUN_INDEXER=1 on the `app` service to fall back to the legacy
# single-process layout.
#
# Configurable via environment (.env):
#   PORT              host port for the web UI (default 8080)
#   DATA_MOUNT        bind-mount target for the data volume. Defaults to the
#                     named volume `data`; set e.g. DATA_MOUNT=/media/12tb/photos-index
#                     to persist data on a big disk. The directory must be writable
#                     by UID 1000 (the user both containers run as).
#   PHOTOS_MOUNT      optional read-only bind mount of a local Google Takeout export,
#                     used to backfill GPS/place data (see README). Unset by default;
#                     uncomment the volume line below when you have one.
#   AUTH_SESSION_MOUNT  bind-mount source for the bridge-only Proton session file
#                     (issue #32). Defaults to ./credentials/auth-session.json;
#                     the file is mounted ONLY into the proton-bridge container so
#                     the internet-facing app / indexer containers cannot read it.
#                     The mount is writable (the SDK refreshes tokens on disk);
#                     see docs/getting-started/session-export.md.
#
# Images are pulled from GitHub Container Registry. `docker compose up` always
# pulls the prebuilt images — there is no local build step. Local development
# against an edited source tree should use `docker compose build --pull` from
# a separate checkout that adds `build:` keys, then push to GHCR.

services:
  proton-bridge:
    image: ghcr.io/mmornati/proton-faces-bridge:latest
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 256
    volumes:
      - ${DATA_MOUNT:-data}:/data
      # Issue #32: the Proton session file (accessToken, refreshToken,
      # userKeyPassword, cachePassword) is mounted ONLY into this container.
      # It is NOT part of the shared `data` volume, so the internet-facing
      # `app` container cannot read it even if it gets RCE / path traversal.
      # The mount is rw because the SDK rewrites tokens on refresh;
      # `auth-session.json` is still excluded from the cache-clear glob in
      # helpers.ts, so a `/cache/clear` call does not delete it.
      - ${AUTH_SESSION_MOUNT:-./credentials/auth-session.json}:/data/auth-session.json
      # Encrypted credential store (PROTON_DRIVE_CREDENTIALS_STORE=pass):
      # the GPG keyring and the pass store live in named volumes mounted ONLY
      # into this container — same isolation rationale as the session file
      # above. Named volumes (not bind mounts) so a fresh setup inherits the
      # image's UID 1000 ownership; a bind-mounted host dir would be created
      # root-owned and `pass init` would fail. Unused with the default
      # unsafe_file backend.
      - bridge-gnupg:/secrets/gnupg
      - bridge-pass-store:/secrets/password-store
    environment:
      - PORT=8090
      - DATA_DIR=/data
      - PROTON_DRIVE_CREDENTIALS_STORE=${PROTON_DRIVE_CREDENTIALS_STORE:-unsafe_file}
      - PROTON_DRIVE_CACHE_DIR=/data
      # Shared secret for bridge HTTP auth. All services on the internal
      # network must use the same token. Generate one with: openssl rand -hex 32
      - BRIDGE_TOKEN=${BRIDGE_TOKEN:-}
      # E2E manifest/address-key verification is DISABLED by default: the patched
      # addresses.ts imports the armored public key without verifying its key token,
      # and fileDownloader.ts skips verifyManifest(). Deliberate workaround for a
      # Bun 1.2 WASM OpenPGP hang (cryptoProxy.decryptMessage) that stalls full-res
      # downloads on migrated accounts that omit the deprecated PublicKey field.
      # Set to 0 to restore full E2E verification (downloads may hang on such accounts).
      - PROTON_DRIVE_SKIP_MANIFEST_VERIFICATION=${PROTON_DRIVE_SKIP_MANIFEST_VERIFICATION:-1}
      # Optional: point at a custom Proton API environment.
      # - PROTON_DRIVE_BASE_URL=drive-api.proton.me
      # Outbound rate limit to Proton API. 3 req/s burst 2 keeps us inside
      # Proton's comfort zone and avoids the 429 "Server errors limit reached"
      # cascade that triggered false-deletions when the timeline listing
      # dropped rows mid-shard during the Aug 27 / Sep 1 Proton incidents.
      - PROTON_BRIDGE_RATE_LIMIT=${PROTON_BRIDGE_RATE_LIMIT:-3}
      - PROTON_BRIDGE_RATE_BURST=${PROTON_BRIDGE_RATE_BURST:-2}
    networks:
      - internal

  indexer:
    # Runs the indexing pipeline only: sync / downloader / fullres / workers
    # / cluster / gps / albums. No public HTTP — only an internal status
    # endpoint on 0.0.0.0:INDEXER_STATUS_PORT (reachable from `app` over
    # the compose `internal` network, no host port published) that the
    # `app` container proxies to populate the footer. Same image as `app`,
    # but a different entry point. Every status route except /healthz
    # requires the shared INDEXER_TOKEN (issue #42) — set it in .env.
    image: ghcr.io/mmornati/proton-faces-app:latest
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    pids_limit: 512
    cpus: "2.0"
    depends_on:
      - proton-bridge
    command: ["python", "indexer_main.py"]
    volumes:
      - ${DATA_MOUNT:-data}:/data
      # Optional Google Takeout export for GPS backfill (read-only).
      - ${PHOTOS_MOUNT:-/dev/null}:/takeout:ro
      # DEV-ONLY: local source override. Uncomment the next line and set
      # LOCAL_SRC in .env to a host directory containing an edited src/
      # tree; /app/src inside the container will be replaced with that
      # tree so code changes take effect without rebuilding the image.
      # Leave commented in prod — the image's baked-in source is used
      # and `docker compose pull && docker compose up -d` is enough.
      # - ${LOCAL_SRC}:/app/src
    environment:
      - DATA_DIR=/data
      - MODELS_DIR=/models
      - PHOTOS_DIR=/takeout
      - BRIDGE_URL=http://proton-bridge:8090
      - BRIDGE_TOKEN=${BRIDGE_TOKEN:-}
      # Bumped 300s → 600s while Proton Drive recovers from the Sep 1 partial
      # outage. Revert to 300 once stable if you want faster sync.
      - SYNC_INTERVAL=${SYNC_INTERVAL:-600}
      - SYNC_LIMIT=${SYNC_LIMIT:-0}
      - WORKERS=${WORKERS:-3}
      - CLUSTER_INTERVAL=${CLUSTER_INTERVAL:-1800}
      - GPS_INTERVAL=${GPS_INTERVAL:-21600}
      - FACE_SIM_THRESHOLD=${FACE_SIM_THRESHOLD:-0.45}
      - MIN_CLUSTER_SIZE=${MIN_CLUSTER_SIZE:-3}
      - MIN_SAMPLES=${MIN_SAMPLES:-2}
      # Grace cycles for pending_removal — only mark 'deleted' after this
      # many consecutive missing polls. Prevents false deletions.
      - PROTON_SYNC_GRACE_CYCLES=${PROTON_SYNC_GRACE_CYCLES:-2}
      # How long a `status='full'` row can sit before being re-queued for
      # full-res download. Unsticks videos left stranded by bridge outages.
      - FULLRES_RETRY_AFTER_SEC=${FULLRES_RETRY_AFTER_SEC:-600}
      # Per-uid backoff after a failed full-res attempt: the fullres loop skips
      # a uid it tried recently instead of hammering the bridge with the same
      # stuck video (which saturates the SDK download queue and starves
      # interactive full-res requests).
      - FULLRES_BACKOFF_SEC=${FULLRES_BACKOFF_SEC:-900}
      # Pause between successful full-res downloads. Bounds sustained bandwidth
      # while the loop drains a backlog (videos are downloaded in full, which
      # saturates a home connection and shows up as cloudflared QUIC timeouts).
      - FULLRES_DRAIN_INTERVAL_SEC=${FULLRES_DRAIN_INTERVAL_SEC:-15}
      # Bound ONNX Runtime / OpenMP thread pools to 1 so the WORKERS face
      # threads + CLIP sessions don't oversubscribe the CPU (issue #79).
      - OMP_NUM_THREADS=1
      - ORT_INTRA_OP_THREADS=${ORT_INTRA_OP_THREADS:-1}
      # Internal-only port for the live status endpoint. Not published to
      # the host; reachable from the `app` service over the compose
      # network via the `indexer` hostname.
      - INDEXER_STATUS_PORT=${INDEXER_STATUS_PORT:-8091}
      # Shared secret required on every status route except /healthz
      # (issue #42). Compose fails loudly if INDEXER_TOKEN is unset
      # (`:?` syntax) so a missing token can never silently leave the
      # control API open. Generate with:  openssl rand -hex 32
      - INDEXER_TOKEN=${INDEXER_TOKEN:?set INDEXER_TOKEN in .env}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - internal

  app:
    image: ghcr.io/mmornati/proton-faces-app:latest
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Each uvicorn worker lazily loads its own CLIP ONNX session (~838 MB RSS
    # measured) + a per-worker matrix cache. Default 6 GiB gives the default
    # UVICORN_WORKERS=2 real headroom; tune with APP_MEM_LIMIT on small boxes.
    # APP_CPUS caps the CLIP/search CPU so it can't starve other containers.
    mem_limit: ${APP_MEM_LIMIT:-6g}
    pids_limit: 512
    cpus: ${APP_CPUS:-2.0}
    healthcheck:
      # Lets a restart loop tell "cold-start still warming up" apart from
      # "OOM-killed / wedged" — the container stays down-until-healthy only
      # while it's genuinely broken instead of while it's still starting.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - proton-bridge
      - indexer
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ${DATA_MOUNT:-data}:/data
      # Optional Google Takeout export for GPS backfill (read-only).
      - ${PHOTOS_MOUNT:-/dev/null}:/takeout:ro
      # DEV-ONLY: local source override. See indexer service above for the
      # full note. Leave commented in prod.
      # - ${LOCAL_SRC}:/app/src
    environment:
      - DATA_DIR=/data
      - MODELS_DIR=/models
      - PHOTOS_DIR=/takeout
      - BRIDGE_URL=http://proton-bridge:8090
      - BRIDGE_TOKEN=${BRIDGE_TOKEN:-}
      - PORT=8080
      # RUN_INDEXER=0 -> serve API only; the `indexer` container handles
      # the pipeline. Flip to 1 to fall back to the legacy in-process layout.
      - RUN_INDEXER=${RUN_INDEXER:-0}
      # How many uvicorn workers serve the API. Default 2. Each worker loads
      # its own CLIP session, so keep this low on memory-constrained hosts
      # (see APP_MEM_LIMIT / APP_CPUS above and config.uvicorn_workers).
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      # Where to read the indexer's live state from. Defaults to
      # http://indexer:8091 (internal compose network only — the
      # indexer container does NOT publish this port to the host).
      - INDEXER_STATUS_PORT=${INDEXER_STATUS_PORT:-8091}
      # Same secret the indexer enforces; sent as `X-Indexer-Token` on
      # every proxy call to /status, /trigger-sync, /sync-config
      # (issue #42). Compose injects the same env var into both
      # containers so they cannot drift.
      - INDEXER_TOKEN=${INDEXER_TOKEN:?set INDEXER_TOKEN in .env}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Bound ONNX Runtime / OpenMP thread pools to 1 (issue #79). The app
      # container runs CLIP sessions for search; keep them from oversubscribing.
      - OMP_NUM_THREADS=1
      - ORT_INTRA_OP_THREADS=${ORT_INTRA_OP_THREADS:-1}
      # Shared across uvicorn workers so signed <img> URLs validate on any
      # worker. REQUIRED: compose refuses to start without it (`:?` fails
      # loudly) so a known default can't be used to forge signed URLs.
      - SIGNING_SECRET=${SIGNING_SECRET:?set SIGNING_SECRET in .env}
    networks:
      - internal

  # --- demo profile ---------------------------------------------------------
  # `docker compose --profile demo up -d` brings up only the demo services:
  # the proton-bridge service is skipped entirely and replaced by a local
  # fixture (see app/src/demo.py). Use this to explore the UI without a real
  # Proton account. Default credentials: demo / proton-faces.
  indexer-demo:
    profiles: ["demo"]
    image: ghcr.io/mmornati/proton-faces-app:latest
    restart: unless-stopped
    command: ["python", "indexer_main.py"]
    volumes:
      - ${DATA_MOUNT:-data}:/data
      - ${PHOTOS_MOUNT:-/dev/null}:/takeout:ro
    environment:
      - DEMO_MODE=1
      - BRIDGE_URL=http://127.0.0.1:1  # unused in demo mode; set so config.py never resolves it
      - DATA_DIR=/data
      - MODELS_DIR=/models
      - PHOTOS_DIR=/takeout
      # Public demo: keep /thumb /full /cover /crop consumable by <img> tags.
      # Default is OFF — binary endpoints require a bearer token or signed URL.
      - DEMO_ALLOW_PUBLIC_THUMBS=1
      - SYNC_INTERVAL=${SYNC_INTERVAL:-600}
      - SYNC_LIMIT=${SYNC_LIMIT:-0}
      - WORKERS=${WORKERS:-3}
      - CLUSTER_INTERVAL=${CLUSTER_INTERVAL:-1800}
      - GPS_INTERVAL=${GPS_INTERVAL:-21600}
      - FACE_SIM_THRESHOLD=${FACE_SIM_THRESHOLD:-0.45}
      - MIN_CLUSTER_SIZE=${MIN_CLUSTER_SIZE:-3}
      - MIN_SAMPLES=${MIN_SAMPLES:-2}
      - INDEXER_STATUS_PORT=${INDEXER_STATUS_PORT:-8091}
      # Demo: fall back to a per-boot ephemeral token if INDEXER_TOKEN is
      # unset, so a fresh `docker compose --profile demo up` still works
      # without a .env file. Operators that want stable across-restart
      # auth can still set INDEXER_TOKEN explicitly.
      - INDEXER_TOKEN=${INDEXER_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD:-proton-faces}
      # Bound ONNX Runtime / OpenMP thread pools to 1 (issue #79).
      - OMP_NUM_THREADS=1
      - ORT_INTRA_OP_THREADS=${ORT_INTRA_OP_THREADS:-1}
    networks:
      - internal

  app-demo:
    profiles: ["demo"]
    image: ghcr.io/mmornati/proton-faces-app:latest
    restart: unless-stopped
    depends_on:
      - indexer-demo
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ${DATA_MOUNT:-data}:/data
      - ${PHOTOS_MOUNT:-/dev/null}:/takeout:ro
    environment:
      - DEMO_MODE=1
      - BRIDGE_URL=http://127.0.0.1:1
      - DATA_DIR=/data
      - MODELS_DIR=/models
      - PHOTOS_DIR=/takeout
      # Public demo: keep /thumb /full /cover /crop consumable by <img> tags.
      # Default is OFF — binary endpoints require a bearer token or signed URL.
      - DEMO_ALLOW_PUBLIC_THUMBS=1
      - PORT=8080
      - RUN_INDEXER=0
      - INDEXER_STATUS_PORT=${INDEXER_STATUS_PORT:-8091}
      - INDEXER_STATUS_URL=http://indexer-demo:8091
      # Demo: fall back to a per-boot ephemeral token if INDEXER_TOKEN is
      # unset (matches indexer-demo's policy — see comment above).
      - INDEXER_TOKEN=${INDEXER_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD:-proton-faces}
      # Bound ONNX Runtime / OpenMP thread pools to 1 (issue #79).
      - OMP_NUM_THREADS=1
      - ORT_INTRA_OP_THREADS=${ORT_INTRA_OP_THREADS:-1}
      # Demo content is public by design, so a fixed signing secret is fine; it
      # keeps signed URLs stable across the demo's 4 uvicorn workers (a
      # per-worker ephemeral secret would cause intermittent 401s on
      # /thumb /full /cover /crop).
      - SIGNING_SECRET=demo-signing-secret
    networks:
      - internal

volumes:
  data:
  bridge-gnupg:
  bridge-pass-store:

networks:
  internal: